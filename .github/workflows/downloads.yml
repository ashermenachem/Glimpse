name: Release downloads
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: |
          python3 scripts/package.py Glimpse.zip
          python3 scripts/package.py --browser safari Glimpse-Safari.zip
      - name: Attach browser downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" Glimpse.zip Glimpse-Safari.zip --clobber
